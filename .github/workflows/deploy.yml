name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write            # WIF 需要

env:
  IMAGE: asia-east1-docker.pkg.dev/moto-hayaku/app/book
  VM_NAME: book-vm
  VM_ZONE: asia-east1-b
  DEPLOY_DIR: /home/h84646513132_business/docker/Book   # 部署位置（絕對路徑）

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 OIDC 換暫時憑證，不需要任何 key
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/199648797108/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: gh-deployer@moto-hayaku.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-east1-docker.pkg.dev -q
      - uses: docker/setup-buildx-action@v3

      # build 並推到 Artifact Registry，用 commit sha 當 tag 方便回滾
      - uses: docker/build-push-action@v6
        with:
          context: .                  # 維持 repo 根目錄，Dockerfile 的 COPY 路徑才對
          file: Book/Dockerfile       # 指定 Dockerfile 位置
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VM
        run: |
          # 取短期 token 讓 VM 能從 Artifact Registry 拉 image
          TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$TOKEN"

          # 先把 compose 檔傳到 VM
          gcloud compute scp deploy/docker-compose.yml \
            $VM_NAME:/tmp/book-compose.yml \
            --zone=$VM_ZONE --tunnel-through-iap --quiet

          gcloud compute ssh $VM_NAME --zone=$VM_ZONE \
            --tunnel-through-iap --quiet --ssh-key-expire-after=10m \
            --command "bash -s" <<EOF
          set -e
          echo "$TOKEN" | sudo env HOME=/root docker login -u oauth2accesstoken --password-stdin asia-east1-docker.pkg.dev
          sudo mkdir -p ${DEPLOY_DIR}
          sudo mv /tmp/book-compose.yml ${DEPLOY_DIR}/docker-compose.yml
          # CI 是用 sudo 建的檔案，改回你的帳號所有，你在 VM 上才能直接編輯
          sudo chown -R h84646513132_business: ${DEPLOY_DIR}
          cd ${DEPLOY_DIR}
          sudo env HOME=/root TAG=${GITHUB_SHA} docker compose pull
          sudo env HOME=/root TAG=${GITHUB_SHA} docker compose up -d
          sudo env HOME=/root docker logout asia-east1-docker.pkg.dev
          sudo docker image prune -f
          EOF