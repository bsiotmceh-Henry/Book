services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express                       # 免費版授權
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}  # 由同目錄的 .env 帶入
      MSSQL_MEMORY_LIMIT_MB: "1536"            # 預設會盡量吃，限制在 1.5G
    volumes:
      - mssql-data:/var/opt/mssql              # 資料持久化
    # 不對外開 1433，只有同一個 compose 網路的 app 連得到
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  book:
    image: asia-east1-docker.pkg.dev/moto-hayaku/app/book:${TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy             # DB 準備好才啟動 app
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=Book;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

volumes:
  mssql-data: